name: Psoydo Cloudflare Pages static QA
on:
  pull_request:
    paths:
      - 'scripts/build-cloudflare-pages.sh'
      - '.github/workflows/cloudflare-pages-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate production pages and route package
        run: |
          python3 scripts/qa_site.py
          python3 scripts/check_seo.py
          sh scripts/build-cloudflare-pages.sh
      - name: Verify only public assets are shipped
        run: |
          test -s cf-dist/de/index.html
          test -s cf-dist/404.html
          test -s cf-dist/og-image.png
          test ! -d cf-dist/docs
          test ! -d cf-dist/deployment
          test ! -d cf-dist/scripts
          test ! -e cf-dist/.htaccess
          grep -q '^/en/ /de/ 301' cf-dist/_redirects
          grep -q 'X-Robots-Tag: noindex, nofollow' cf-dist/_headers
          node --check cf-dist/app.js
