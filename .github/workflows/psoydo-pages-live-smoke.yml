name: Psoydo Pages cutover read-only smoke
on:
  pull_request:
    paths:
      - '.github/workflows/psoydo-pages-live-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - name: Probe current apex, canary www and Pages preview
        shell: bash
        run: |
          set -uo pipefail
          for hostname in 'https://www.psoydo.com' 'https://psoydo.com' 'https://psoydo-website.pages.dev'; do
            echo "=== BASE $hostname ==="
            for path in '/de/' '/de/datenschutz.html' '/robots.txt' '/sitemap.xml' '/app.js' '/de/this-page-does-not-exist-94352'; do
              headers="$(mktemp)"
              code="$(curl --silent --show-error --location --retry 2 --retry-delay 1 --max-time 35 --max-redirs 6 --dump-header "$headers" --output /tmp/psoydo-body --write-out 'HTTP=%{http_code} TLS_VERIFY=%{ssl_verify_result} FINAL=%{url_effective} IP=%{remote_ip}' "$hostname$path")" || code="NETWORK-FAIL"
              echo "PROBE $hostname$path $code"
              grep -iE '^(HTTP/|server:|location:|cf-ray:|x-robots-tag:|x-content-type-options:)' "$headers" | tail -n 10 || true
              rm -f "$headers"
            done
          done
